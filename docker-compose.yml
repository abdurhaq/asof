# Local stack: the app + a Neo4j database (alternative to AuraDB Free).
#   docker compose up --build   ->  app on http://localhost:7860, Neo4j browser on http://localhost:7474
services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/asof-password
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j-data:/data]
  app:
    build: .
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: asof-password
    ports: ["7860:7860"]
    depends_on: [neo4j]
volumes:
  neo4j-data:
